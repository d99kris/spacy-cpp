name: Linux

# Automatic runs disabled as project is no longer maintained. To re-enable,
# replace workflow_dispatch below with:
#   pull_request:
#   push:
#     branches:
#       - master
#       - main
#       - dev/*
on:
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Build Linux
      run: ./make.sh all
