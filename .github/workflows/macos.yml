name: macOS

# Automatic runs disabled as project is no longer maintained. To re-enable,
# replace workflow_dispatch below with:
#   pull_request:
#   push:
#     branches:
#       - master
#       - main
#       - dev/*
on:
  workflow_dispatch:

jobs:
  mac-build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Build macOS
      env:
        PIP_BREAK_SYSTEM_PACKAGES: "1"
        PIP_USER: "1"
      run: ./make.sh all
